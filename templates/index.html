<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Smell Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span>CodeSmell Detector</span>
                </div>
            </div>
            <div class="header-center">
                <div class="input-mode-tabs">
                    <button class="tab-btn active" data-mode="github">GitHub Repo</button>
                    <button class="tab-btn" data-mode="upload">Upload Files</button>
                    <button class="tab-btn" data-mode="paste">Paste Code</button>
                </div>
            </div>
            <div class="header-right">
                <button id="newSessionBtn" class="new-session-btn" title="Start a new analysis session">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    New Session
                </button>
                <button id="analyzeBtn" class="analyze-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Find Code Smells
                </button>
            </div>
        </header>

        <!-- Input Panel -->
        <div class="input-panel" id="inputPanel">
            <!-- GitHub Mode -->
            <div class="input-section active" id="githubSection">
                <div class="input-group">
                    <label>GitHub Repository URL</label>
                    <input type="text" id="githubUrl" placeholder="https://github.com/username/repository" 
                           value="https://github.com/apache/commons-lang">
                    <span class="hint">Supports public repositories. Example: https://github.com/apache/commons-lang</span>
                </div>
            </div>

            <!-- Upload Mode -->
            <div class="input-section" id="uploadSection">
                <div class="drop-zone" id="dropZone">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Drag & drop Java files or ZIP here</p>
                    <span>or click to browse</span>
                    <input type="file" id="fileInput" multiple accept=".java,.zip" hidden>
                </div>
                <div class="file-list" id="fileList"></div>
            </div>

            <!-- Paste Mode -->
            <div class="input-section" id="pasteSection">
                <div class="input-group">
                    <label>Java Source Code</label>
                    <textarea id="codeInput" placeholder="Paste your Java code here..." spellcheck="false"></textarea>
                </div>
            </div>
        </div>

        <!-- Main Content (hidden until analysis) -->
        <div class="main-content hidden" id="mainContent">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>Project Explorer</span>
                    <span class="file-count" id="fileCount">0 files</span>
                </div>
                <div class="file-tree" id="fileTree"></div>
            </aside>

            <!-- Editor -->
            <div class="editor-panel">
                <div class="editor-tabs" id="editorTabs"></div>
                <div class="editor-container">
                    <div class="line-numbers" id="lineNumbers"></div>
                    <pre class="code-editor" id="codeEditor"><code></code></pre>
                </div>
            </div>

            <!-- Right Panel -->
            <aside class="right-panel">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-panel="smells">Smells</button>
                    <button class="panel-tab" data-panel="metrics">Metrics</button>
                </div>

                <!-- Smells Panel -->
                <div class="panel-content active" id="smellsPanel">
                    <div class="smells-header">
                        <span class="smell-count" id="smellCount">0 smells detected</span>
                        <div class="filter-buttons">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="High">High</button>
                            <button class="filter-btn" data-filter="Medium">Medium</button>
                        </div>
                    </div>
                    <div class="smells-list" id="smellsList"></div>
                </div>

                <!-- Metrics Panel -->
                <div class="panel-content" id="metricsPanel">
                    <div class="metrics-dashboard" id="metricsDashboard"></div>
                </div>
            </aside>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p>Analyzing source code...</p>
            <span id="loadingDetail">Parsing Java files</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
